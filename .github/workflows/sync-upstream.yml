name: sync-upstream

# Keep this fork current with ChromeDevTools/chrome-devtools-mcp releases.
#
# The fork exists for ONE reason: upstream's plugin manifest launches the MCP server
# with `npx`, which re-resolves the package against the registry on every spawn
# (~9.3s of pure overhead here) and intermittently blows Claude Code's hard 30s
# handshake budget. This fork commits the built `build/` output and launches it with
# `node` instead (~4-7s). Everything else tracks upstream verbatim.
#
# This job does all the WORK (sync, rebuild, smoke-test) but deliberately does NOT
# merge: an unattended bot must never merge its own output. It opens a PR for a human.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Find the latest upstream release
        id: up
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ChromeDevTools/chrome-devtools-mcp.git
          git fetch -q upstream --tags
          TAG=$(git tag -l 'chrome-devtools-mcp-v*' --sort=-v:refname | head -1)
          NEW=${TAG#chrome-devtools-mcp-v}
          CUR=$(node -p "require('./package.json').version")
          {
            echo "tag=$TAG"
            echo "new=$NEW"
            echo "cur=$CUR"
          } >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$CUR" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Already on $CUR - nothing to do."
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Upstream $NEW > ours $CUR - syncing."
          fi

      - name: Merge the upstream tag
        if: steps.up.outputs.stale == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE="$(git rev-parse HEAD)"
          git checkout -b "sync/${{ steps.up.outputs.new }}"
          git merge --no-edit "${{ steps.up.outputs.tag }}" || true

          # Conflicts in GENERATED files are resolved by taking upstream's copy, because
          # every one of them is rebuilt from source in the next step. Merging a generated
          # artifact is meaningless: the merge result is not what either side's generator
          # would produce, so a "successful" three-way merge of a lockfile or a bundle is a
          # file nobody has ever built.
          #
          #   .claude-plugin/plugin.json  upstream bumps the version and re-pins npx; we
          #                               rewrite the launcher. Regenerated below.
          #   package-lock.json           THIS is what broke the job every day from at least
          #                               2026-08-11 to 08-14: the comment above used to say
          #                               plugin.json was "the only file that can conflict",
          #                               and the lockfile conflicted on every run. It is safe
          #                               to take upstream's WHOLESALE because this fork does
          #                               not modify package.json at all (verified: the fork
          #                               delta is plugin.json, .fork/, this workflow,
          #                               CONTRIBUTING.md, package-lock.json and build/) — so
          #                               upstream's lockfile is correct by construction, and
          #                               `npm ci` below would reject any lockfile that was
          #                               not.
          #   build/**                    committed build output, regenerated by `npm run
          #                               bundle` below.
          #
          # Anything OUTSIDE that set is hand-written and a conflict there is a real
          # decision, so the job still fails loudly rather than guessing.
          for f in .claude-plugin/plugin.json package-lock.json; do
            git checkout --theirs -- "$f" 2>/dev/null || true
            git add -- "$f" 2>/dev/null || true
          done
          # `|| true` is REQUIRED, not defensive. This step runs under `set -euo pipefail`
          # AND `bash -e`, and grep exits 1 when it matches nothing — which is the NORMAL
          # case here, because build/ usually does not conflict. Without it the script dies
          # before resolving anything, and the log shows the merge conflicts with no error
          # message of its own, which reads exactly like the resolution never ran. It did
          # not: grep killed the shell.
          for f in $(git diff --name-only --diff-filter=U | grep '^build/' || true); do
            git checkout --theirs -- "$f" 2>/dev/null || true
            git add -- "$f" 2>/dev/null || true
          done

          # KEEP OUR WORKFLOWS WHOLESALE. GITHUB_TOKEN can never push a change under
          # .github/workflows/: that needs the `workflows` App permission, which is NOT part
          # of the `permissions:` vocabulary a workflow can request. There is no setting that
          # fixes this - only a PAT would, and a PAT is not something this job should hold.
          #
          # The failure it produces names a file, not a permission problem, so it reads like a
          # merge fault:
          #   ! [remote rejected] sync/1.7.0 -> sync/1.7.0 (refusing to allow a GitHub App to
          #     create or update workflow `.github/workflows/pre-release.yml` without
          #     `workflows` permission)
          #
          # Dropping upstream's workflows is also correct on the merits, not just expedient:
          # they are release automation for a package whose npm name is owned upstream, and
          # this fork must never publish it (see .fork/README.md). The only workflow this fork
          # needs is this one.
          #
          # `git rm` first, so a workflow file ADDED by upstream is deleted rather than left
          # behind - `git checkout BASE -- <dir>` alone would restore ours and keep theirs.
          git rm -r -q -f --ignore-unmatch -- .github/workflows >/dev/null 2>&1 || true
          git checkout "$BASE" -- .github/workflows
          git add -- .github/workflows

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::unresolved conflicts in hand-written files - resolve by hand"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit --no-edit || true

      - name: Build and re-apply the fork patch
        if: steps.up.outputs.stale == 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          # MUST be `bundle`, NOT `build`. `build` (tsc + post-build) is the DEV target: it
          # leaves bare imports (urlpattern-polyfill, core-js) to be resolved from
          # node_modules, which do not exist in a plugin cache clone. `bundle` additionally
          # runs rollup to inline them and deletes build/node_modules -- it is what produces
          # the shipped npm artifact. Using `build` here ships a plugin that cannot start.
          npm run bundle
          node .fork/apply-patches.mjs
          if [ -d build/node_modules ]; then
            echo "::error::build/node_modules exists -- bundle did not inline deps"
            exit 1
          fi

      - name: Smoke-test the artifact OUTSIDE the repo (no node_modules to fall back on)
        if: steps.up.outputs.stale == 'true'
        run: |
          set -euo pipefail
          # Testing inside the repo is worthless: node resolves missing packages from the
          # top-level node_modules that `npm ci` just created, so a non-self-contained build
          # passes. Copy build/ somewhere with no node_modules on any ancestor -- which is
          # exactly what the plugin cache clone looks like -- and test THERE.
          ISO=$(mktemp -d)
          cp -r build "$ISO/build"
          ENTRY="$ISO/build/src/bin/chrome-devtools-mcp.js"
          if [ ! -f "$ENTRY" ]; then
            echo "::error::bundle did not produce the entry point"
            exit 1
          fi
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          OUT=$(printf '%s\n' "$REQ" | timeout 60 node "$ENTRY" 2>/tmp/err.log | head -1 || true)
          if ! echo "$OUT" | grep -q '"serverInfo"'; then
            echo "::error::MCP initialize handshake failed from an isolated dir"
            echo "--- stdout ---"; echo "$OUT"
            echo "--- stderr ---"; head -20 /tmp/err.log
            exit 1
          fi
          echo "handshake OK (isolated): $OUT"

      - name: Commit the rebuilt bundle
        if: steps.up.outputs.stale == 'true'
        run: |
          set -euo pipefail
          # build/ is gitignored upstream -> force-add, but SCOPED. Never `git add -f -A`.
          # Everything EXCEPT source maps (~47MB, dev-only). Note this must include the
          # non-.js runtime assets: build/src/third_party/issue-descriptions/*.md and
          # bundled-packages.json are READ AT RUNTIME, so a `*.js`-only filter breaks the server.
          find build -type f ! -name '*.map' -print0 | xargs -0 git add -f --
          git add -- .claude-plugin/plugin.json
          cat > /tmp/msg.txt <<'MSG'
          chore(fork): sync to upstream and rebuild the node launcher

          Rebuilt build/ from the upstream release tag and regenerated
          .claude-plugin/plugin.json so the MCP server launches via node, not npx.

          The MCP initialize handshake was verified against the built artifact in CI.
          MSG
          sed -i 's/^          //' /tmp/msg.txt
          git commit -F /tmp/msg.txt

      - name: Open a PR (a bot must not merge its own output)
        if: steps.up.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.up.outputs.new }}
          CUR: ${{ steps.up.outputs.cur }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          # A sync branch left behind by a FAILED earlier run wedges this job forever:
          # the new branch is cut from current main, the stale remote branch is not, and
          # every subsequent push is rejected non-fast-forward. That is exactly what
          # happened -- sync/1.6.0 sat from 2026-07-14 and killed every nightly run since.
          #
          # If a PR is already open for this branch the work is queued for review and
          # there is nothing to do. Otherwise the branch is bot-generated debris,
          # regenerated from upstream on every run, so replacing it loses nothing.
          if [ "$(gh pr list --head "sync/${NEW}" --state open --json number --jq 'length')" != "0" ]; then
            echo "PR already open for sync/${NEW} - nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "sync/${NEW}" >/dev/null 2>&1; then
            echo "Replacing stale sync/${NEW} (no open PR)."
            git push origin --delete "sync/${NEW}"
          fi
          git push -u origin "sync/${NEW}"
          cat > /tmp/body.md <<MSG
          Automated upstream sync: **${CUR} -> ${NEW}**.

          - merged upstream tag \`${TAG}\`
          - rebuilt \`build/\` and committed the runtime \`.js\` (source maps and tsbuildinfo excluded)
          - regenerated \`.claude-plugin/plugin.json\` via \`.fork/apply-patches.mjs\` (node launcher, not npx)
          - **MCP \`initialize\` handshake verified in CI** - the artifact speaks MCP, not merely "the file exists"

          Merging is left to a human by design: no unattended bot self-merge.

          To deploy after merge:
          \`/plugin marketplace update chrome-devtools-plugins\` then \`/reload-plugins\`.
          MSG
          sed -i 's/^          //' /tmp/body.md
          gh pr create --title "chore(fork): sync to upstream ${NEW}" --body-file /tmp/body.md
